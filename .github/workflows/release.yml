name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-darwin-arm64
            asset: ts-facts-darwin-arm64
          - target: bun-darwin-x64
            asset: ts-facts-darwin-x64
          - target: bun-linux-x64
            asset: ts-facts-linux-x64
          - target: bun-linux-arm64
            asset: ts-facts-linux-arm64
          - target: bun-windows-x64
            asset: ts-facts-windows-x64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Compile binary
        run: bun build --compile --target=${{ matrix.target }} --outfile=../../release/${{ matrix.asset }} src/index.ts
        working-directory: apps/ts-facts

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: release/${{ matrix.asset }}

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd release
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum ts-facts-* > checksums.txt
          else
            shasum -a 256 ts-facts-* > checksums.txt
          fi
          cat checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
